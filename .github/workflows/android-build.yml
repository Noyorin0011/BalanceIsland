name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # Tag builds create/update GitHub Releases. GitHub keeps this token read-only
  # for pull requests opened from forks.
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || echo "SDK packages may already be present"
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-35|build-tools;35.0.0" && echo "SDK_OK" || true

      - name: Validate translations
        run: |
          python3 tools/validate_translations.py app/src/main/res/values/strings.xml app/src/main/res/values-en/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-ja/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-b+zh+Hant+TW/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-ko/strings.xml

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BalanceIsland-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or replace debug APK
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && endsWith(github.ref_name, '-debug') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*$/\1/p' app/build.gradle.kts | head -n 1 | tr -d '\r')"
          test -n "$version_name"

          expected_tag="v${version_name}-debug"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version; expected $expected_tag." >&2
            exit 1
          fi

          release_asset="$RUNNER_TEMP/BalanceIsland-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$release_asset"

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Balance Island ${GITHUB_REF_NAME}" \
              --prerelease \
              --notes "Debug-signed testing build. It may not install over a build signed by another key."
          fi

          gh release upload "$GITHUB_REF_NAME" "$release_asset" --clobber

      - name: Prepare release keystore
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/balance-island-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/balance-island-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        env:
          BALANCE_ISLAND_STORE_FILE: ${{ runner.temp }}/balance-island-release.jks
          BALANCE_ISLAND_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BALANCE_ISLAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BALANCE_ISLAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release signature
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          test -f "$apk"
          test -x "$apksigner"
          certificate="$($apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certificate"
          if grep -qi "CN=Android Debug" <<<"$certificate"; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi

      - name: Upload signed release APK
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        uses: actions/upload-artifact@v7
        with:
          name: BalanceIsland-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or replace Release APK
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*$/\1/p' app/build.gradle.kts | head -n 1 | tr -d '\r')"
          test -n "$version_name"

          expected_tag="v${version_name}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version; expected $expected_tag." >&2
            exit 1
          fi

          release_tag="$GITHUB_REF_NAME"
          release_asset="$RUNNER_TEMP/BalanceIsland-v${version_name}.apk"
          source_root="$RUNNER_TEMP/BalanceIsland-v${version_name}-source"
          source_asset="$RUNNER_TEMP/BalanceIsland-v${version_name}-source-minimal.zip"
          release_notes="$RUNNER_TEMP/BalanceIsland-v${version_name}-notes.md"
          cp app/build/outputs/apk/release/app-release.apk "$release_asset"

          # Since v0.9.2, publish a version-scoped, minimal buildable source tree.
          # Copy only files required by the Android build plus mandatory notices;
          # never archive the checkout wholesale, so local/task/generated files
          # cannot leak into a release asset.
          rm -rf "$source_root" "$source_asset"
          mkdir -p "$source_root/app/src"
          cp -R app/src/main "$source_root/app/src/main"
          cp app/build.gradle.kts app/proguard-rules.pro "$source_root/app/"
          cp build.gradle.kts settings.gradle.kts gradle.properties \
            gradlew gradlew.bat LICENSE NOTICE_BRAND_ICONS.md "$source_root/"
          chmod +x "$source_root/gradlew"

          # Archive before invoking Gradle so no cache or build output can enter it.
          (
            cd "$RUNNER_TEMP"
            zip -q -r "$source_asset" "$(basename "$source_root")"
          )
          test -s "$source_asset"

          archive_entries="$(unzip -Z1 "$source_asset")"
          forbidden_source_path='(^|/)(\.git|\.github|\.gradle|\.gradle-dist|build|tools)(/|$)|(^|/)(CODEX_[^/]*|local\.properties|[^/]*\.(apk|aab|jks|keystore))$'
          if grep -Eq "$forbidden_source_path" <<<"$archive_entries"; then
            echo "Minimal source archive contains a forbidden path:" >&2
            grep -E "$forbidden_source_path" <<<"$archive_entries" >&2
            exit 1
          fi

          # Prove the exact copied source tree can produce a Debug APK. The ZIP
          # is already sealed, so files produced by this check cannot enter it.
          gradle -p "$source_root" :app:assembleDebug \
            --project-cache-dir "$RUNNER_TEMP/minimal-source-gradle-cache" \
            --no-daemon --stacktrace >/dev/null

          if [[ -f "NOTE.md" ]]; then
            cp NOTE.md "$release_notes"
          elif [[ -f "CHANGELOG.md" ]]; then
            awk -v version="$version_name" '
              BEGIN { target = "## " version }
              $0 == target { capture = 1 }
              capture && $0 ~ /^## / && $0 != target { exit }
              capture { print }
            ' CHANGELOG.md > "$release_notes"
          fi
          [[ -s "$release_notes" ]] || rm -f "$release_notes"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            if [[ -f "$release_notes" ]]; then
              gh release create "$release_tag" \
                --verify-tag \
                --title "Balance Island v$version_name" \
                --latest \
                --notes-file "$release_notes"
            else
              gh release create "$release_tag" \
                --verify-tag \
                --title "Balance Island v$version_name" \
                --latest \
                --notes "Automated signed Android release build."
            fi
          elif [[ -f "$release_notes" ]]; then
            gh release edit "$release_tag" \
              --title "Balance Island v$version_name" \
              --latest \
              --notes-file "$release_notes"
          fi

          # Keep one authoritative signed APK in the matching release.
          while IFS= read -r old_asset; do
            [[ -z "$old_asset" ]] || gh release delete-asset "$release_tag" "$old_asset" --yes
          done < <(gh release view "$release_tag" --json assets --jq '.assets[].name | select(endswith(".apk"))')

          gh release upload "$release_tag" "$release_asset" "$source_asset" --clobber

      - name: Remove release keystore
        if: ${{ always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-debug') }}
        run: rm -f "$RUNNER_TEMP/balance-island-release.jks"
