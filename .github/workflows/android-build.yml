name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || echo "SDK packages may already be present"
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-35|build-tools;35.0.0" && echo "SDK_OK" || true

      - name: Validate translations
        run: |
          python3 tools/validate_translations.py app/src/main/res/values/strings.xml app/src/main/res/values-en/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-ja/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-b+zh+Hant+TW/strings.xml
          python3 tools/validate_translations.py app/src/main/res/values-en/strings.xml app/src/main/res/values-ko/strings.xml

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BalanceIsland-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
